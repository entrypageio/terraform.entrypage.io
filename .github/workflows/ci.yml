name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify formatting
        run: gofmt -w $(find . -type f -name '*.go' -not -path './.terraform/*')

      - name: Go tidy
        run: go mod tidy

      - name: Go test
        run: go test ./...
